[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-invoice-extractor"
version = "0.1.0"
description = "LLM invoice extraction you can trust: schema-validated output, evidence spans verified against the document, arithmetic and VAT checks, repair loop, model fallback, caching, cost tracking and a field-accuracy gate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Admire T. Ndaneta" }]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "fastapi>=0.115", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
invx = "invx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invx"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["invx"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["invx"]
branch = true
